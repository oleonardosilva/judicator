plugins {
    id 'com.gradleup.shadow'
    id 'xyz.jpenilla.run-velocity'
}

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    implementation project(':judicator-common')
    implementation 'org.bstats:bstats-velocity:3.2.1'

    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

tasks {
    // the plugin is the shadow jar: on a case-insensitive disk the plain one had the same file name
    jar {
        archiveClassifier.set('plain')
    }

    test {
        useJUnitPlatform()
    }

    runVelocity {
        velocityVersion("3.4.0-SNAPSHOT")
    }

    shadowJar {
        archiveBaseName.set('Judicator-Velocity')
        archiveClassifier.set('')
        mergeServiceFiles()
        // Other plugins ship their own bStats: keep ours in the plugin's package.
        relocate 'org.bstats', 'com.elless.judicator.libs.bstats'
    }

    build {
        dependsOn shadowJar
    }
}
