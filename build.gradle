plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '8.3.8' apply false
    id 'xyz.jpenilla.run-velocity' version '3.0.2' apply false
    id 'xyz.jpenilla.run-paper' version '3.0.2' apply false
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.minecraftforge.gradle' version '[7.0.13,8.0)' apply false
}

allprojects {
    group = 'com.elless.plugin'
    version = '2.0.0'
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
        maven { name = "papermc-repo"; url = "https://repo.papermc.io/repository/maven-public/" }
        maven { name = "spigotmc-repo"; url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
        maven { name = "sonatype"; url = "https://oss.sonatype.org/content/groups/public/" }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.projectlombok:lombok:1.18.42'
        testCompileOnly 'org.projectlombok:lombok:1.18.42'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    }

    def targetJavaVersion = 17
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(targetJavaVersion)
    }
}
