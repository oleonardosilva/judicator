# ============================================================
#  Judicator — Discord webhook
# ============================================================
# Posts an embed to a Discord channel for every punishment. Applied with /judicator reload.
# Create the webhook in Discord (channel settings > Integrations > Webhooks) and paste its URL below.
# The embed is posted once, by the server that applied the punishment.
#
# Placeholders for title, description and footer:
#   {player}   punished player          {punisher}  staff member who applied it
#   {reason}   reason                   {type}      BAN, TEMPBAN, MUTE, SOFTMUTE, KICK... (labels.warn for warns)
#   {id}       id in the database       {expires}   end date, or the 'permanent'/'paused' label below
# Colours: hex, e.g. "#FF0000".

enabled: false

webhook-url: "" # channel for every event; an event can post to another one with its own webhook-url
username: "" # name shown as the author of the message (empty: the webhook's name)
avatar-url: "" # picture of the author (empty: the webhook's picture)
thumbnail-url: "https://mc-heads.net/avatar/{uuid}" # picture of the player; {uuid} is their UUID (MHF_Steve when unknown)
footer: "Judicator • ID #{id}"

labels: # names of the embed fields, and texts for what has no value
  player: "Player"
  punisher: "Punisher"
  type: "Type"
  reason: "Reason"
  started-at: "Started At"
  expires: "Expires"
  scope: "Only on" # a punishment for one server or group (scopes in config.yml)
  permanent: "Permanent"
  paused: "Paused (online time only)"
  no-reason: "No reason provided"
  warn: "Warn" # the type shown for warns
  report: "Report" # the type shown for player reports
  reporter: "Reported by"
  server: "Server" # where the reported player was
  revoked-by: "Revoked by"
  revoke-reason: "Revocation reason"
  edited-by: "Changed by"
  change: "Change"
  removed-by: "Removed by"

events:
  ban:
    enabled: true
    color: "#E74C3C"
    title: "🔨 Player Banned"
    description: "Player **{player}** was permanently banned by **{punisher}**."

  tempban:
    enabled: true
    color: "#E67E22"
    title: "⏱️ Temporary Ban"
    description: "Player **{player}** received a temporary ban from **{punisher}**."

  mute:
    enabled: true
    color: "#9B59B6"
    title: "🔇 Player Muted"
    description: "Player **{player}** was permanently muted by **{punisher}**."

  tempmute:
    enabled: true
    color: "#8E44AD"
    title: "⏱️ Temporary Mute"
    description: "Player **{player}** received a temporary mute from **{punisher}**."

  jail:
    enabled: true
    color: "#7F8C8D"
    title: "⛓️ Player Jailed"
    description: "Player **{player}** was sent to jail by **{punisher}**."

  tempjail:
    enabled: true
    color: "#95A5A6"
    title: "⛓️ Temporary Jail"
    description: "Player **{player}** was sent to jail for a while by **{punisher}**."

  kick:
    enabled: true
    color: "#F39C12"
    title: "👢 Player Kicked"
    description: "Player **{player}** was kicked by **{punisher}**."

  warn:
    enabled: true
    color: "#F1C40F"
    title: "⚠️ Warning Issued"
    description: "Player **{player}** received a warning from **{punisher}**."
    # webhook-url: "" # e.g. warns in a channel of their own

  # What changes a punishment afterwards, so the channel is a full record of the staff's actions.
  revoke: # /unban, /unmute, /unjail, /revoke and the API, one embed per punishment revoked
    enabled: true
    color: "#2ECC71"
    title: "🔓 Punishment Revoked"
    description: "The {type} of **{player}** (#{id}) was revoked by **{revoker}**."

  edit: # /extend and /changereason
    enabled: true
    color: "#3498DB"
    title: "✏️ Punishment Changed"
    description: "**{author}** changed the {type} #{id} of **{player}**: {change}."

  unwarn: # /unwarn and the API delete the warn, so this embed is the only record left of it
    enabled: true
    color: "#95A5A6"
    title: "🧹 Warning Removed"
    description: "The warning #{id} of **{player}** was removed by **{revoker}**."

  rollback: # /staffrollback, one embed for the whole rollback
    enabled: true
    color: "#E67E22"
    title: "⏪ Staff Rollback"
    description: "**{author}** undid what **{staff}** applied in the last {period}: {punishments} punishment(s) revoked, {warns} warning(s) deleted."

  staff-locked: # a staff member went past staff-rate-limit.max (config.yml) and was locked out of punishing
    enabled: true
    color: "#8E44AD"
    title: "🚨 Staff Member Locked"
    description: "**{staff}** applied **{count}** {type}(s) in {window} and was locked out of punishing. See what to undo with `/staffrollback {staff} {period}`, release with `/staffunlock {staff}`."

  report: # /report: off by default, a busy server gets many
    enabled: false
    color: "#3498DB"
    title: "📣 Player Reported"
    description: "**{punisher}** reported **{player}**."
