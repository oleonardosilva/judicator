punish:
  title:
    - "       &6&lOpenMine Network - Punições\n"
    - "\n"
  line:
    message: "    &f&l• &f{reason}\n"
    hoverMessage:
      - "&eTipo: §a{type}\n&ePermissão: §a{permission}\n&ePor endereço IP: {toggle}\n&eDuração: §a{duration}"
