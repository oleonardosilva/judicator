  title: "&eBans in force &7({count} in total, page {page}/{pages})\n\n"
  line: "    &f&l• &e#{id} &7- &f{nickname} &7- &c{type} &7- &funtil {finishAt}\n"
  hover:
    - "&c * Reason: &f{reason}\n"
    - "&c * Start: &f{startedAt}\n"
    - "&c * End: &f{finishAt}\n"
    - "&c * Author: &f{author}\n"
    - "&c * Where: &f{scope}\n"
    - "\n&7Click to view the punishment."
