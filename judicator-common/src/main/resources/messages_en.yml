notifications:
  punish: "&7[Staff] &f{author} &7applied &c{type} &7to &f{nickname}&7: &f{reason}"
  unpunish: "&7[Staff] &f{author} &7revoked {count} &a{type} &7of &f{nickname}"
  edit: "&7[Staff] &f{author} &7changed &e#{id} &7of &f{nickname}&7: {change}"
  rollback: "&7[Staff] &f{author} &7rolled back &f{staff} &7(last {period}): {punishments} punishment(s) revoked, {warns} warn(s) deleted"
  silent-prefix: "&8[silent] "

alts:
  title: "&eAccounts that shared an IP with &f{nickname}&e:"
  line: "&f • &e{account} &7- {status}"
  hover: "&7Click to see the punishment history of {account}"
  none: "&aNo other accounts were found for {nickname}."
  notify: "&e[Alts] &f{nickname} &7shares an IP with banned/muted account(s): &c{accounts}"
  denied: "&e[Alts] &f{nickname} &7was refused: shares an IP with the banned account &c{account} &7(#{id})"
  status:
    banned: "&cbanned"
    muted: "&6muted"
    clean: "&aclean"

blame:
  title: "&ePunishments applied by &f{staff} &7({count} in total, page {page}/{pages})\n\n"
  line: "    &f&l• &e#{id} &7- &c{type} &7- &f{nickname} &7- &f{startedAt}\n"
  none: "&c{staff} has not applied any punishment."
  title-since: "&ePunishments applied by &f{staff} &7in the last &f{period} &7({count} in total, page {page}/{pages})\n\n"
  none-since: "&c{staff} has not applied any punishment in the last {period}."
  hover:
    - "&c * Reason: &f{reason}\n"
    - "&c * Start: &f{startedAt}\n"
    - "&c * End: &f{finishAt}\n"
    - "&c * Author: &f{author}\n"
    - "&c * Status: &f{status}\n"
    - "\n&7Click to view the punishment."

