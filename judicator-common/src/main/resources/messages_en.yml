  not-active: "&cOnly a punishment in force can be changed."
  permanent: "&cOnly a temporary punishment can be extended."
  not-allowed: "&cOnly the author of this punishment, or a staff member above them, can change it."

rollback:
  preview: "&eIn the last &f{period}&e, &f{staff} &eapplied what is still in force: &f{bans} &eban(s), &f{mutes} &emute(s) and &f{warns} &eactive warn(s). Bans and mutes will be revoked and warns deleted. "
