  hover:
    - "&c * Reason: &f{reason}\n"
    - "&c * Start: &f{startedAt}\n"
    - "&c * End: &f{finishAt}\n"
    - "&c * Author: &f{author}\n"
    - "&c * Where: &f{scope}\n"
    - "\n&7Click to view the punishment."
  none: "&aThere are no mutes in force."

activity:
