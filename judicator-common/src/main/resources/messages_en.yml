  line: "    &f&l• &e{staff}&7: {summary}\n"
  entry: "&f{count} &c{type}"
  separator: "&7, "
  hover: "&7{total} in total. Click to list what {staff} applied in the last {period}."
  none: "&cNo punishments or warns were applied in the last {period}."

pagination:
  previous: "&e&l« &ePrevious "
  page: "&7| Page {page}/{pages} |"
  next: " &eNext &e&l»"
  hover: "&7Click to open page {page}"

edit:
  extended: "&aPunishment #{id} of {nickname} now ends {finishAt}."
  reason-changed: "&aThe reason of punishment #{id} of {nickname} is now: &f{reason}"
  change-duration: "&fnow ends {finishAt}"
