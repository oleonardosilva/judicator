name: Judicator
version: '${version}'
main: com.openmc.judicator.bukkit.JudicatorBukkit
api-version: '1.18'
author: oleonardosilva
website: https://github.com/oleonardosilva
description: A moderation plugin
libraries:
  - com.zaxxer:HikariCP:6.3.0
  - com.mysql:mysql-connector-j:9.3.0
  - org.postgresql:postgresql:42.7.7
  - com.github.ben-manes.caffeine:caffeine:3.1.8
commands:
  judicator:
    permission: judicator.admin
    description: Judicator administration (reload, help, version).
    aliases: [jud]
  ban:
    permission: judicator.command.ban
    description: Permanently bans a player.
  banip:
    permission: judicator.command.banip
    description: Permanently bans the IP of a player.
  tempban:
    permission: judicator.command.tempban
    description: Temporarily bans a player.
  tempbanip:
    permission: judicator.command.tempbanip
    description: Temporarily bans the IP of a player.
  mute:
    permission: judicator.command.mute
    description: Permanently mutes a player.
  muteip:
    permission: judicator.command.muteip
    description: Permanently mutes the IP of a player.
  tempmute:
    permission: judicator.command.tempmute
    description: Temporarily mutes a player.
  tempmuteip:
    permission: judicator.command.tempmuteip
    description: Temporarily mutes the IP of a player.
  kick:
    permission: judicator.command.kick
    description: Kicks a player.
  punish:
    permission: judicator.command.punish
    description: Punishes a player with a preset reason.
    aliases: [punir, castigar]
  punishview:
    permission: judicator.command.punishview
    description: Shows a punishment by its ID.
    aliases: [pview]
  punishhistory:
    permission: judicator.command.punishhistory
    description: Shows the punishment history of a player.
    aliases: [phistory]
  revoke:
    permission: judicator.admin
    description: Revokes a punishment by its ID.
    aliases: [revogar, revocar]
  warn:
    permission: judicator.command.warn
    description: Warns a player.
  tempwarn:
    permission: judicator.command.tempwarn
    description: Temporarily warns a player.
  unwarn:
    permission: judicator.command.unwarn
    description: Removes a warn by its ID.
  warnview:
    permission: judicator.command.warnview
    description: Shows a warn by its ID.
    aliases: [wview]
  warnhistory:
    permission: judicator.command.warnhistory
    description: Shows the warn history of a player.
    aliases: [whistory]
  unban:
    description: Revokes the active bans of a player.
    permission: judicator.command.unban
  unmute:
    description: Revokes the active mutes of a player.
    permission: judicator.command.unmute
  alts:
    description: Lists accounts that shared an IP with a player.
    permission: judicator.command.alts
  blame:
    description: Lists the punishments applied by a staff member.
    permission: judicator.command.blame
    aliases: [staffhistory]
  banlist:
    description: Lists the bans in force.
    permission: judicator.command.banlist
  mutelist:
    description: Lists the mutes in force.
    permission: judicator.command.mutelist
  activity:
    description: Shows how many punishments each staff member applied in a period.
    permission: judicator.command.activity
    aliases: [staffactivity]
  staffrollback:
    description: Revokes the punishments and deletes the warns a staff member applied in a period.
    permission: judicator.command.staffrollback
  extend:
    description: Adds time to a temporary punishment in force.
    permission: judicator.command.extend
  changereason:
    description: Changes the reason of a punishment in force.
    permission: judicator.command.changereason
  note:
    description: Writes a staff note about a player.
    permission: judicator.command.note
  notes:
    description: Lists the staff notes about a player.
    permission: judicator.command.notes
  delnote:
    description: Deletes a staff note.
    permission: judicator.command.delnote
  playerinfo:
    description: Shows a summary of a player (punishments, warns, notes, alts, last login).
    permission: judicator.command.playerinfo
    aliases: [pinfo]
  softmute:
    description: Mutes a player without them noticing (they still see their own messages).
    permission: judicator.command.softmute
  tempsoftmute:
    description: Temporarily mutes a player without them noticing.
    permission: judicator.command.tempsoftmute
permissions:
  judicator.admin:
    description: Full access to every Judicator command.
    default: op
    children:
      judicator.command.ban: true
      judicator.command.banip: true
      judicator.command.tempban: true
      judicator.command.tempbanip: true
      judicator.command.mute: true
      judicator.command.muteip: true
      judicator.command.tempmute: true
      judicator.command.tempmuteip: true
      judicator.command.kick: true
      judicator.command.punish: true
      judicator.command.punishview: true
      judicator.command.punishhistory: true
      judicator.command.warnview: true
      judicator.command.warnhistory: true
      judicator.command.warn: true
      judicator.command.tempwarn: true
      judicator.command.unwarn: true
      judicator.command.unban: true
      judicator.command.unmute: true
